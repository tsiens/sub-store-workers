name: Sync Upstream Sub-Store

on:
  schedule:
    # 每天 UTC 16:00 = 北京 00:00
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '强制部署（即使无更新）'
        required: false
        default: 'false'

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout sub-store-workers
        uses: actions/checkout@v4
        with:
          path: sub-store-workers
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Sub-Store (upstream)
        uses: actions/checkout@v4
        with:
          repository: sub-store-org/Sub-Store
          path: Sub-Store
          fetch-depth: 1

      - name: Get upstream version
        id: upstream
        working-directory: Sub-Store
        run: |
          SHA=$(git rev-parse HEAD)
          VERSION=$(node -p "require('./backend/package.json').version")
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Upstream: $VERSION ($SHA)"

      - name: Read last synced version
        id: last
        working-directory: sub-store-workers
        run: |
          if [ -f .upstream-sha ]; then
            LAST=$(cat .upstream-sha)
          else
            LAST="none"
          fi
          echo "sha=$LAST" >> $GITHUB_OUTPUT
          echo "Last synced: $LAST"

      - name: Reconcile Pages mode
        id: pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT_NAME: ${{ secrets.PAGES_PROJECT_NAME }}
          NO_PAGE: ${{ secrets.NO_PAGE }}
        run: |
          set -euo pipefail

          NO_PAGE_VALUE=$(printf '%s' "${NO_PAGE:-}" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
          if [ -z "$NO_PAGE_VALUE" ] || [ "$NO_PAGE_VALUE" = "false" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Pages deployment is enabled"
            exit 0
          fi

          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "Pages deployment is disabled by NO_PAGE"

          API_ROOT="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          PROJECT_URL="${API_ROOT}/pages/projects/${PAGES_PROJECT_NAME}"
          AUTH=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          STATUS=$(curl -sS -o /tmp/pages-mode-project.json -w '%{http_code}' "$PROJECT_URL" "${AUTH[@]}")

          if [ "$STATUS" = "200" ]; then
            echo "Deleting existing Pages project '$PAGES_PROJECT_NAME'"
            curl -fsS -X DELETE "$PROJECT_URL" "${AUTH[@]}" >/tmp/pages-project-delete.json
          elif [ "$STATUS" = "404" ]; then
            echo "Pages project '$PAGES_PROJECT_NAME' does not exist"
          else
            echo "::error::Failed to inspect Pages project '$PAGES_PROJECT_NAME' (HTTP $STATUS)"
            cat /tmp/pages-mode-project.json
            exit 1
          fi

      - name: Check if update needed
        id: check
        run: |
          if [ "${{ steps.upstream.outputs.sha }}" = "${{ steps.last.outputs.sha }}" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "needed=false" >> $GITHUB_OUTPUT
            echo "No update needed"
          else
            echo "needed=true" >> $GITHUB_OUTPUT
            echo "Update needed"
          fi

      - name: Setup Node
        if: steps.check.outputs.needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: sub-store-workers/package-lock.json

      - name: Enable corepack
        if: steps.check.outputs.needed == 'true'
        run: corepack enable

      - name: Configure upstream pnpm build scripts
        if: steps.check.outputs.needed == 'true'
        working-directory: Sub-Store/backend
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'pnpm-workspace.yaml';
          const approved = ['core-js', 'esbuild', 'nodemon'];
          let text = fs.existsSync(file) ? fs.readFileSync(file, 'utf8') : '';
          text = text.replace(/^onlyBuiltDependencies:\n(?:[ \t].*(?:\n|$))*/m, '');
          if (!/^packages:/m.test(text)) {
            text = `packages:\n  - .\n${text.trim() ? `\n${text.trimStart()}` : ''}`;
          }
          if (!/^allowBuilds:/m.test(text)) {
            text = `${text.replace(/\s*$/, '')}\nallowBuilds:\n`;
          }
          for (const name of approved) {
            const escaped = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const pattern = new RegExp(`^(\\s*${escaped}\\s*:\\s*).*$`, 'm');
            if (pattern.test(text)) {
              text = text.replace(pattern, `$1true`);
            } else {
              text = text.replace(/^allowBuilds:\n/m, `allowBuilds:\n  ${name}: true\n`);
            }
          }
          fs.writeFileSync(file, text);
          NODE
          cat pnpm-workspace.yaml

      - name: Install upstream deps
        if: steps.check.outputs.needed == 'true'
        working-directory: Sub-Store/backend
        run: pnpm install --no-frozen-lockfile

      - name: Run upstream tests
        if: steps.check.outputs.needed == 'true'
        working-directory: Sub-Store/backend
        run: pnpm test

      - name: Install workers deps
        if: steps.check.outputs.needed == 'true'
        working-directory: sub-store-workers
        run: npm ci

      - name: Increase QuickJS memory limit
        if: steps.check.outputs.needed == 'true'
        working-directory: sub-store-workers
        run: |
          FILE=src/vendor/quickjs-executor.js
          echo "Before:"
          grep -n 'setMemoryLimit' "$FILE" || true
          if grep -Fq 'runtime.setMemoryLimit(1024 * 512);' "$FILE"; then
            sed -i 's/runtime\.setMemoryLimit(1024 \* 512);/runtime.setMemoryLimit(1024 * 1024 * 16);/' "$FILE"
          elif grep -Fq 'runtime.setMemoryLimit(1024 * 1024 * 16);' "$FILE"; then
            echo "QuickJS memory limit is already 16 MiB"
          else
            echo "::error::Upstream QuickJS memory-limit line changed; refusing to build without applying the 16 MiB patch"
            grep -n 'setMemoryLimit' "$FILE" || true
            exit 1
          fi
          echo "After:"
          grep -n 'setMemoryLimit' "$FILE"

      - name: Build worker
        if: steps.check.outputs.needed == 'true'
        working-directory: sub-store-workers
        run: npm run build

      - name: Check worker bundle size
        if: steps.check.outputs.needed == 'true'
        id: size
        working-directory: sub-store-workers
        run: |
          BYTES=$(stat -c %s dist/worker.js)
          KB=$(awk "BEGIN {printf \"%.1f\", $BYTES/1024}")
          MB=$(awk "BEGIN {printf \"%.2f\", $BYTES/1024/1024}")
          GZIP_BYTES=$(gzip -c dist/worker.js | wc -c)
          GZIP_KB=$(awk "BEGIN {printf \"%.1f\", $GZIP_BYTES/1024}")
          echo "bytes=$BYTES" >> $GITHUB_OUTPUT
          echo "kb=$KB" >> $GITHUB_OUTPUT
          echo "mb=$MB" >> $GITHUB_OUTPUT
          echo "gzip_kb=$GZIP_KB" >> $GITHUB_OUTPUT
          echo "worker.js raw: ${KB} KB (${MB} MB), gzipped: ${GZIP_KB} KB"
          # Workers 付费上限 10 MiB（gzipped），免费 3 MiB（gzipped）
          HARD_LIMIT=$((10 * 1024 * 1024))
          if [ "$GZIP_BYTES" -gt "$HARD_LIMIT" ]; then
            echo "::error::Worker bundle gzipped size ${GZIP_KB} KB exceeds Cloudflare 10 MiB hard limit"
            exit 1
          fi
          FREE_LIMIT=$((3 * 1024 * 1024))
          if [ "$GZIP_BYTES" -gt "$FREE_LIMIT" ]; then
            echo "::warning::Worker bundle gzipped size ${GZIP_KB} KB exceeds Cloudflare free tier 3 MiB limit (paid plan required)"
          fi

      - name: Ensure KV namespace
        if: steps.check.outputs.needed == 'true'
        id: kv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE: ${{ secrets.KV_NAMESPACE }}
        run: |
          set -euo pipefail

          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces"
          AUTH=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")

          LIST=$(curl -fsS "${API}?per_page=1000" "${AUTH[@]}")
          KV_ID=$(printf '%s' "$LIST" | jq -r --arg title "$KV_NAMESPACE" \
            '.result[] | select(.title == $title) | .id' | sed -n '1p')

          if [ -z "$KV_ID" ]; then
            echo "KV namespace '$KV_NAMESPACE' does not exist; creating it"
            CREATED=$(curl -fsS -X POST "$API" "${AUTH[@]}" \
              --data "$(jq -n --arg title "$KV_NAMESPACE" '{title: $title}')")
            KV_ID=$(printf '%s' "$CREATED" | jq -r '.result.id // empty')
          else
            echo "Using existing KV namespace '$KV_NAMESPACE'"
          fi

          if [ -z "$KV_ID" ]; then
            echo "::error::Failed to resolve KV namespace '$KV_NAMESPACE'"
            exit 1
          fi

          echo "namespace_id=$KV_ID" >> "$GITHUB_OUTPUT"
          echo "KV namespace id resolved"

      - name: Generate wrangler.toml
        if: steps.check.outputs.needed == 'true'
        working-directory: sub-store-workers
        run: |
          cat > wrangler.toml <<'TOML'
          name = "sub-store"
          main = "dist/worker.js"
          compatibility_date = "2024-09-23"
          compatibility_flags = ["nodejs_compat"]

          [[kv_namespaces]]
          binding = "SUB_STORE_DATA"
          id = "__KV_ID__"

          [triggers]
          crons = ["55 15 * * *"]

          [vars]
          SCRIPT_ENGINE = "quickjs"
          SUB_STORE_BACKEND_CUSTOM_NAME = "Workers"
          SUB_STORE_BACKEND_CUSTOM_ICON = "https://cdn.jsdelivr.net/gh/Yu9191/sub-store-workers@main/png/cloudflare.png"
          TOML
          sed -i 's/^          //' wrangler.toml
          sed -i "s/__KV_ID__/${{ steps.kv.outputs.namespace_id }}/" wrangler.toml
          echo "Generated wrangler.toml:"
          cat wrangler.toml

      - name: Deploy Workers
        if: steps.check.outputs.needed == 'true'
        working-directory: sub-store-workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Set Workers secret
        if: steps.check.outputs.needed == 'true'
        working-directory: sub-store-workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUB_STORE_FRONTEND_BACKEND_PATH: ${{ secrets.SUB_STORE_FRONTEND_BACKEND_PATH }}
        run: |
          set -euo pipefail
          printf '%s' "$SUB_STORE_FRONTEND_BACKEND_PATH" |
            npx wrangler secret put SUB_STORE_FRONTEND_BACKEND_PATH

      - name: Ensure Pages project and bind KV
        if: steps.check.outputs.needed == 'true' && steps.pages.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID: ${{ steps.kv.outputs.namespace_id }}
          PAGES_PROJECT_NAME: ${{ secrets.PAGES_PROJECT_NAME }}
        run: |
          set -euo pipefail

          API_ROOT="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          PROJECT_URL="${API_ROOT}/pages/projects/${PAGES_PROJECT_NAME}"
          AUTH=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")

          STATUS=$(curl -sS -o /tmp/pages-project.json -w '%{http_code}' "$PROJECT_URL" "${AUTH[@]}")
          if [ "$STATUS" = "404" ]; then
            echo "Pages project '$PAGES_PROJECT_NAME' does not exist; creating it"
            curl -fsS -X POST "${API_ROOT}/pages/projects" "${AUTH[@]}" \
              --data "$(jq -n --arg name "$PAGES_PROJECT_NAME" \
                '{
                  name: $name,
                  production_branch: "main",
                  deployment_configs: {
                    production: {},
                    preview: {}
                  }
                }')" >/tmp/pages-project-create.json
          elif [ "$STATUS" != "200" ]; then
            echo "::error::Failed to inspect Pages project '$PAGES_PROJECT_NAME' (HTTP $STATUS)"
            cat /tmp/pages-project.json
            exit 1
          else
            echo "Using existing Pages project '$PAGES_PROJECT_NAME'"
          fi

          curl -fsS -X PATCH "$PROJECT_URL" "${AUTH[@]}" \
            --data "$(jq -n --arg kv "$KV_NAMESPACE_ID" '{
              deployment_configs: {
                production: {
                  kv_namespaces: {
                    SUB_STORE_DATA: { namespace_id: $kv }
                  },
                  env_vars: {
                    SCRIPT_ENGINE: { value: "quickjs", type: "plain_text" }
                  }
                }
              }
            }')" >/tmp/pages-project-config.json

          echo "Pages project is ready and SUB_STORE_DATA is bound"

      - name: Set Pages secret
        if: steps.check.outputs.needed == 'true' && steps.pages.outputs.enabled == 'true'
        working-directory: sub-store-workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT_NAME: ${{ secrets.PAGES_PROJECT_NAME }}
          SUB_STORE_FRONTEND_BACKEND_PATH: ${{ secrets.SUB_STORE_FRONTEND_BACKEND_PATH }}
        run: |
          set -euo pipefail
          printf '%s' "$SUB_STORE_FRONTEND_BACKEND_PATH" |
            npx wrangler pages secret put SUB_STORE_FRONTEND_BACKEND_PATH \
              --project-name "$PAGES_PROJECT_NAME" \
              --env production

      - name: Prepare Pages bundle
        if: steps.check.outputs.needed == 'true' && steps.pages.outputs.enabled == 'true'
        working-directory: sub-store-workers
        run: |
          mkdir -p pages-dist
          cp dist/worker.js pages-dist/_worker.js
          cp dist/quickjs.wasm pages-dist/quickjs.wasm

      - name: Deploy Pages
        if: steps.check.outputs.needed == 'true' && steps.pages.outputs.enabled == 'true'
        working-directory: sub-store-workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy pages-dist \
            --project-name "${{ secrets.PAGES_PROJECT_NAME }}" \
            --branch main \
            --commit-message "upstream ${{ steps.upstream.outputs.version }}" \
            --commit-dirty=true

      - name: Health check
        if: steps.check.outputs.needed == 'true'
        run: |
          URL="https://sub-store.${{ secrets.WORKERS_SUBDOMAIN }}.workers.dev"
          for i in 1 2 3; do
            sleep 10
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL/")
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ] || [ "$CODE" = "302" ] || [ "$CODE" = "404" ]; then
              echo "Worker is alive"
              exit 0
            fi
          done
          echo "Worker health check failed"
          exit 1

      - name: Write job summary
        if: always() && steps.check.outputs.needed == 'true'
        run: |
          {
            echo "## Sub-Store Workers 同步结果"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 上游版本 | \`${{ steps.upstream.outputs.version }}\` |"
            echo "| 上游 SHA | \`${{ steps.upstream.outputs.sha }}\` |"
            echo "| 上次同步 SHA | \`${{ steps.last.outputs.sha }}\` |"
            echo "| Worker 原始大小 | ${{ steps.size.outputs.kb }} KB (${{ steps.size.outputs.mb }} MB) |"
            echo "| Worker gzip 大小 | ${{ steps.size.outputs.gzip_kb }} KB |"
            if [ "${{ steps.pages.outputs.enabled }}" = "true" ]; then
              echo "| Pages | deployed |"
            else
              echo "| Pages | disabled and removed |"
            fi
            echo ""
            if [ "${{ steps.last.outputs.sha }}" != "none" ] && [ "${{ steps.last.outputs.sha }}" != "${{ steps.upstream.outputs.sha }}" ]; then
              echo "**上游 diff**: https://github.com/sub-store-org/Sub-Store/compare/${{ steps.last.outputs.sha }}...${{ steps.upstream.outputs.sha }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update upstream-sha marker
        if: steps.check.outputs.needed == 'true'
        working-directory: sub-store-workers
        run: |
          echo "${{ steps.upstream.outputs.sha }}" > .upstream-sha
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .upstream-sha
          git commit -m "chore: sync upstream to ${{ steps.upstream.outputs.version }} [skip ci]" || exit 0
          git push

      - name: Bark notify success
        if: steps.check.outputs.needed == 'true' && success() && env.BARK_KEY != ''
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: |
          TITLE=$(printf 'Sub-Store %%E5%%B7%%B2%%E6%%9B%%B4%%E6%%96%%B0' | sed 's/%%/%/g')
          if [ "${{ steps.pages.outputs.enabled }}" = "true" ]; then
            TARGETS="Workers%20%2B%20Pages"
          else
            TARGETS="Workers"
          fi
          curl -s "https://api.day.app/${BARK_KEY}/Sub-Store%20${{ steps.upstream.outputs.version }}/${TARGETS}%20deployed"

      - name: Bark notify failure
        if: failure() && env.BARK_KEY != ''
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          UPSTREAM_VERSION: ${{ steps.upstream.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          VER="${UPSTREAM_VERSION:-unknown}"
          TITLE="Sub-Store%20Sync%20Failed%20${VER}"
          BODY=$(printf '%s' "${RUN_URL}" | sed 's/:/%3A/g; s|/|%2F|g')
          curl -s "https://api.day.app/${BARK_KEY}/${TITLE}/${BODY}"
